services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: evoting-app
    container_name: evoting-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - evoting-network
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - REVERB_HOST=${REVERB_HOST:-localhost}
      - REVERB_PORT=${REVERB_PORT:-8080}
      - COMPOSER_HOME=/tmp/composer
    command: sh -c "php-fpm"

  webserver:
    image: nginx:alpine
    container_name: evoting-webserver
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "${APP_PORT:-8888}:80"
    depends_on:
      - app
    networks:
      - evoting-network

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: evoting-app
    container_name: evoting-queue-worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    networks:
      - evoting-network
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    command: sh -c "php artisan queue:work redis --tries=3 --max-time=3600"

  reverb:
    image: evoting-app
    container_name: evoting-reverb
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - app
    networks:
      - evoting-network
    ports:
      - "${REVERB_PORT:-8080}:8080"
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    command: sh -c "php artisan reverb:start --host=0.0.0.0 --port=8080"

  postgres:
    image: postgres:17-alpine
    container_name: evoting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-evoting}
      POSTGRES_USER: ${DB_USERNAME:-evoting}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-evoting_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-evoting} -d ${DB_DATABASE:-evoting}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evoting-network

  redis:
    image: redis:7-alpine
    container_name: evoting-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evoting-network

volumes:
  postgres_data:
  redis_data:

networks:
  evoting-network:
    driver: bridge