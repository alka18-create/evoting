memory_limit=256M
upload_max_filesize=20M
post_max_size=20M
max_execution_time=60
max_input_time=60
expose_php=Off
date.timezone=UTC
opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1

[curl]
curl.cainfo=/usr/local/etc/php/conf.d/cacert.pem